<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勤怠システム</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family: sans-serif;}
        body{background:#f5f8fc;padding:30px;display:flex;align-items:center;justify-content:center;min-height:100vh;}
        .login-box{background:#fff;width:100%;max-width:420px;padding:40px 30px;border-radius:16px;box-shadow:0 2px 12px #00000010;}
        h1{text-align:center;font-size:26px;color:#222;margin-bottom:35px;}
        .item{margin-bottom:22px;}
        label{display:block;font-size:15px;color:#555;margin-bottom:8px;}
        input{width:100%;padding:14px 12px;border:1px solid #d0d7e3;border-radius:8px;font-size:16px;}
        #loginBtn{width:100%;padding:16px;background:#2468eb;color:#fff;border:none;border-radius:8px;font-size:18px;margin-top:10px;cursor:pointer;}
        .tip{margin-top:25px;text-align:center;color:#777;font-size:14px;line-height:1.6;}
    </style>
</head>
<body>
<div class="login-box">
    <h1>勤怠システム ログイン</h1>
    <div class="item">
        <label>メールアドレス</label>
        <input id="mail" value="misao0122misao@gmail.com">
    </div>
    <div class="item">
        <label>パスワード</label>
        <input id="pwd" type="password">
    </div>
    <button id="loginBtn">ログイン</button>
    <div class="tip">
        管理者初期アカウント：<br>
        misao0122misao@gmail.com<br>
        初期パスワード：admin123
    </div>
</div>

<script>
const btn = document.getElementById('loginBtn');
btn.onclick = function(){
    const mail = document.getElementById('mail').value.trim();
    const pwd = document.getElementById('pwd').value.trim();
    if(mail === 'misao0122misao@gmail.com' && pwd === 'admin123'){
        alert('ログイン成功！');
        // 这里替换成跳转考勤主页代码
        location.href = './attendance.html';
    }else{
        alert('メールまたはパスワードが違います');
    }
}
</script>
</body>
</html>
