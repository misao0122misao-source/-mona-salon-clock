<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mona Salon 勤怠打刻システム</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Meiryo",sans-serif;}
body{background:#f8f6f0;color:#443a30;min-height:100vh;padding:16px;}
/* タブヘッダー */
.tab-header{display:flex;background:#e9e5dd;border-radius:12px;margin-bottom:20px;}
.tab-btn{flex:1;padding:14px 0;text-align:center;border:none;background:transparent;font-size:17px;border-radius:12px;}
.tab-btn.active{background:#5a4f43;color:#fff;}
/* 上部統計カード */
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.stat-card{background:#fff;border:1px #e0dbd0 solid;border-radius:10px;padding:18px;}
.stat-card.wide{grid-column:1/-1;}
.stat-num{font-size:42px;font-weight:bold;margin-top:6px;}
.stat-label{font-size:16px;color:#776b5e;}
/* スタッフカード */
.staff-card{background:#fff;border:1px #e0dbd0 solid;border-radius:12px;padding:16px;margin-bottom:14px;}
.staff-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.staff-name{font-size:20px;font-weight:500;}
.tag{padding:4px 12px;border-radius:20px;font-size:13px;}
.tag-wait{background:#e9e5dd;color:#665c50;}
.tag-working{background:#d6eedb;color:#287038;}
.time-text{color:#887c6f;margin:8px 0 16px;}
.clock-btn{width:100%;padding:14px;border:1px #c9c2b6 solid;background:#f3efe6;border-radius:10px;font-size:16px;}
/* ログイン画面 */
.login-box{max-width:440px;margin:80px auto;background:#fff;padding:30px;border-radius:16px;border:1px #e0dbd0 solid;}
.login-box h2{text-align:center;margin-bottom:24px;}
input,select{width:100%;padding:13px 14px;margin:8px 0 16px;border:1px #ddd solid;border-radius:10px;font-size:15px;}
.login-submit{width:100%;padding:14px;background:#5a4f43;color:#fff;border:none;border-radius:10px;font-size:17px;}
/* 管理者画面ボタン */
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px;}
.admin-card{background:#fff;padding:20px;border-radius:12px;border:1px #e0dbd0 solid;text-align:center;}
.export-full{width:100%;padding:14px;background:#5a4f43;color:#fff;border:none;border-radius:10px;margin-bottom:20px;}
/* 汎用非表示 */
.hidden{display:none !important;}
</style>
</head>
<body>
<div id="app">
  <!-- ログイン画面 -->
  <div id="loginScreen" class="login-box">
    <h2>Mona Salon 勤怠システム</h2>
    <select id="loginRole">
      <option value="staff">打刻端末（スタッフ用）</option>
      <option value="admin">店長管理画面</option>
    </select>
    <input type="email" id="adminMail" placeholder="管理者メール：mizao0122misao@gmail.com">
    <button class="login-submit" onclick="loginCheck()">ログイン</button>
  </div>

  <!-- スタッフ打刻端末画面（あなたの画像UI完全再現） -->
  <div id="staffClockScreen" class="hidden">
    <div class="tab-header">
      <button class="tab-btn active" onclick="switchTab('clock',this)">打刻</button>
      <button class="tab-btn" onclick="switchTab('balance',this)">対帳</button>
    </div>
    <!-- 統計表示 -->
    <div class="stat-row">
      <div class="stat-card">
        <div class="stat-label">出勤中</div>
        <div class="stat-num" id="workingCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">在籍スタッフ</div>
        <div class="stat-num" id="allStaffCount">0</div>
      </div>
    </div>
    <div class="stat-row">
      <div class="stat-card wide">
        <div class="stat-label">未退勤</div>
        <div class="stat-num" id="notClockOutCount">0</div>
      </div>
    </div>
    <!-- スタッフ一覧打刻カード -->
    <div id="staffListWrap"></div>
  </div>

  <!-- 店長管理者画面 -->
  <div id="adminScreen" class="hidden">
    <h2 style="text-align:center;margin-bottom:20px;">管理者管理画面</h2>
    <div class="admin-grid">
      <div class="admin-card" onclick="showStaffManage()">👥 従業員管理</div>
      <div class="admin-card" onclick="showDailyRecord()">📋 当日記録</div>
      <div class="admin-card" onclick="showMonthTotal()">📅 月間集計</div>
      <div class="admin-card" onclick="showNotClockOut()">⚠️ 未退勤一覧</div>
    </div>
    <button class="export-full" onclick="exportAllCSV()">CSV一括出力</button>
    <div id="adminContentWrap" class="card"></div>
  </div>
</div>

<script>
// データ保存キー
const STORAGE_KEY = "monanail_clock_data";
// 初期データ
let appData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
  adminMail:"mizao0122misao@gmail.com",
  staffList:[
    {id:1,name:"あき",hourWage:1100},
    {id:2,name:"ななこ",hourWage:1100},
    {id:3,name:"ミオン",hourWage:1200},
    {id:4,name:"みか",hourWage:1100}
  ],
  clockRecords:[],
  payTypes:["現金","クレジットカード","PayPay"]
};

// データ保存関数
function saveData(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(appData));
  refreshAllView();
}

// 現在時刻取得
function getNowTime(){
  const d = new Date();
  const h = String(d.getHours()).padStart(2,"0");
  const m = String(d.getMinutes()).padStart(2,"0");
  return `${h}:${m}`;
}
// 本日判定用日付文字列
function getTodayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}

// ログイン処理
function loginCheck(){
  const role = document.getElementById("loginRole").value;
  const mail = document.getElementById("adminMail").value.trim();
  if(role === "admin" && mail !== appData.adminMail){
    alert("管理者メールが一致しません");
    return;
  }
  document.getElementById("loginScreen").classList.add("hidden");
  if(role === "staff"){
    document.getElementById("staffClockScreen").classList.remove("hidden");
    refreshStaffClockView();
  }else{
    document.getElementById("adminScreen").classList.remove("hidden");
  }
}

// タブ切替（打刻/対帳）
function switchTab(target,tabEl){
  document.querySelectorAll("#staffClockScreen .tab-btn").forEach(t=>t.classList.remove("active"));
  tabEl.classList.add("active");
  if(target === "balance") alert("対帳機能は開発中です");
}

// 打刻端末画面全体描画
function refreshStaffClockView(){
  const today = getTodayStr();
  let working = 0;
  let notClockOut = 0;
  // 統計数計算
  appData.staffList.forEach(staff=>{
    const rec = appData.clockRecords.find(r=>r.staffId === staff.id && r.date === today);
    if(rec && !rec.clockOutTime){
      working++;
      notClockOut++;
    }
  })
  document.getElementById("workingCount").innerText = working;
  document.getElementById("allStaffCount").innerText = appData.staffList.length;
  document.getElementById("notClockOutCount").innerText = notClockOut;

  // スタッフカード描画
  const wrap = document.getElementById("staffListWrap");
  wrap.innerHTML = "";
  appData.staffList.forEach(staff=>{
    const rec = appData.clockRecords.find(r=>r.staffId === staff.id && r.date === today);
    let tagText = "未打刻";
    let tagClass = "tag-wait";
    let inTime = "----:--";
    let outTime = "----:--";
    let btnText = "出勤打刻";
    if(rec){
      inTime = rec.clockInTime;
      if(!rec.clockOutTime){
        tagText = "勤務中";
        tagClass = "tag-working";
        btnText = "退勤打刻";
      }else{
        outTime = rec.clockOutTime;
      }
    }
    wrap.innerHTML += `
    <div class="staff-card">
      <div class="staff-head">
        <span class="staff-name">${staff.name}</span>
        <span class="tag ${tagClass}">${tagText}</span>
      </div>
      <div class="time-text">出勤: ${inTime} / 退勤: ${outTime}</div>
      <button class="clock-btn" onclick="staffClockAction(${staff.id})">${btnText}</button>
    </div>
    `;
  })
}

// 出勤/退勤打刻実行
function staffClockAction(staffId){
  const today = getTodayStr();
  const staff = appData.staffList.find(s=>s.id === staffId);
  const existRec = appData.clockRecords.find(r=>r.staffId === staffId && r.date === today);
  if(!existRec){
    // 出勤打刻新規作成
    appData.clockRecords.push({
      staffId:staffId,
      staffName:staff.name,
      date:today,
      clockInTime:getNowTime(),
      clockOutTime:null
    })
  }else if(!existRec.clockOutTime){
    // 退勤打刻更新
    existRec.clockOutTime = getNowTime();
  }else{
    alert("本日既に退勤済みです");
    return;
  }
  saveData();
}

// 全画面更新
function refreshAllView(){
  refreshStaffClockView();
}

// CSV出力簡易機能
function exportAllCSV(){
  let csv = "日付,スタッフ名,出勤時間,退勤時間\n";
  appData.clockRecords.forEach(r=>{
    csv += `${r.date},${r.staffName},${r.clockInTime},${r.clockOutTime || ""}\n`;
  })
  const blob = new Blob([csv],{type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;a.download = "勤怠記録.csv";
  a.click();URL.revokeObjectURL(url);
}

// 管理者画面簡易メニュー（拡張用）
function showStaffManage(){alert("従業員追加・削除機能");}
function showDailyRecord(){alert("本日全打刻記録一覧");}
function showMonthTotal(){alert("月間勤務時間・給与自動計算");}
function showNotClockOut(){alert("本日未退勤スタッフ一覧表示");}
</script>
</body>
</html>
